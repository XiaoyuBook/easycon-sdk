name: Required CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: required-ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  EASYCON_RUST_VERSION: "1.97.1"

jobs:
  policy:
    name: Required / Policy
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out the candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Isolate generated outputs
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$env:RUNNER_TEMP\easycon-policy-cargo-target" -Encoding utf8

      - name: Load the MSVC x64 developer environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "vswhere.exe was not found"
          }
          $installationPath = (@(& $vswhere -latest -products "*" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath))[0]
          if ([string]::IsNullOrWhiteSpace($installationPath)) {
            throw "Visual Studio with the x64 C++ toolchain was not found"
          }
          $installationPath = $installationPath.Trim()
          $devShell = Join-Path $installationPath "Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Import-Module $devShell
          Enter-VsDevShell -VsInstallPath $installationPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          if ($env:VSCMD_ARG_TGT_ARCH -cne "x64") {
            throw "MSVC target architecture is not x64"
          }
          $variables = @(
            "INCLUDE",
            "LIB",
            "LIBPATH",
            "VCINSTALLDIR",
            "VCToolsInstallDir",
            "VSINSTALLDIR",
            "WindowsSdkDir",
            "WindowsSDKVersion",
            "UniversalCRTSdkDir",
            "UCRTVersion",
            "VSCMD_ARG_HOST_ARCH",
            "VSCMD_ARG_TGT_ARCH"
          )
          foreach ($name in $variables) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "MSVC environment variable $name is empty"
            }
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "$name=$value" -Encoding utf8
          }
          $toolDirectories = @("cl.exe", "link.exe", "lib.exe", "rc.exe", "mt.exe") |
            ForEach-Object { Split-Path -Parent (Get-Command $_ -ErrorAction Stop).Source } |
            Select-Object -Unique
          foreach ($directory in $toolDirectories) {
            Add-Content -LiteralPath $env:GITHUB_PATH -Value $directory -Encoding utf8
          }

      - name: Install and verify the frozen Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $toolchain = Get-Content -Raw -LiteralPath rust-toolchain.toml
          if ($toolchain -notmatch '(?m)^channel = "1\.97\.1"\r?$') {
            throw "rust-toolchain.toml does not pin Rust 1.97.1"
          }
          rustup toolchain install $env:EASYCON_RUST_VERSION `
            --profile minimal `
            --component clippy `
            --component rustfmt `
            --target $env:CARGO_BUILD_TARGET
          $actualVersion = ((rustc --version) -split '\s+')[1]
          if ($actualVersion -cne $env:EASYCON_RUST_VERSION) {
            throw "rustc $actualVersion does not match $env:EASYCON_RUST_VERSION"
          }
          $actualHost = ((rustc --version --verbose | Select-String '^host: ').Line -split '\s+')[1]
          if ($actualHost -cne $env:CARGO_BUILD_TARGET) {
            throw "Rust host $actualHost does not match $env:CARGO_BUILD_TARGET"
          }
          $installedTargets = @(rustup target list --toolchain $env:EASYCON_RUST_VERSION --installed)
          if ($installedTargets -notcontains $env:CARGO_BUILD_TARGET) {
            throw "the frozen Windows Rust target is not installed"
          }
          if ($env:VSCMD_ARG_HOST_ARCH -cne "x64" -or $env:VSCMD_ARG_TGT_ARCH -cne "x64") {
            throw "the persisted MSVC developer environment is not x64-hosted x64"
          }
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            throw "cl.exe is not available after loading the MSVC environment"
          }
          if (-not (Get-Command link.exe -ErrorAction SilentlyContinue)) {
            throw "link.exe is not available after loading the MSVC environment"
          }
          rustc --version --verbose
          cargo --version --verbose
          python --version

      - name: Run repository policy gates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/check_repository_guards.py
          python tools/check_markdown_links.py
          python tools/validate_specs.py

      - name: Check changed lines and repository cleanliness
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          git diff --check
          if (-not [string]::IsNullOrWhiteSpace($env:BASE_SHA) -and $env:BASE_SHA -notmatch '^0+$') {
            git cat-file -e "${env:BASE_SHA}^{commit}"
            git diff --check "${env:BASE_SHA}...HEAD"
          }
          $status = @(git status --porcelain=v1 --untracked-files=all)
          if ($status.Count -ne 0) {
            $status | Out-Host
            throw "policy gates left tracked or unignored output"
          }

  windows-workspace:
    name: Required / Windows Workspace
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Check out the candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize the controlled cache root
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) {
            throw "RUNNER_TEMP is not available"
          }
          $cacheRoot = Join-Path $env:RUNNER_TEMP "easycon-windows-workspace"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "EASYCON_BUILD_CACHE_ROOT=$cacheRoot" -Encoding utf8

      - name: Restore Cargo downloads
        id: cargo_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/easycon-windows-workspace/caches/cargo-download-cache
          key: windows-workspace-cargo-v4-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tests/support/Cargo.toml', 'rust-toolchain.toml', 'tools/windows_build_environment.json', 'tools/windows_workspace.psm1', 'tools/run_windows_workspace.ps1', '.github/workflows/required-ci.yml') }}

      - name: Restore vcpkg binary cache
        id: vcpkg_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/easycon-windows-workspace/caches/vcpkg-binary-cache
          key: windows-workspace-vcpkg-v4-${{ hashFiles('tools/windows_build_environment.json', 'vcpkg.json', 'vcpkg-configuration.json', 'cmake/triplets/**', 'CMakePresets.json', '.github/workflows/required-ci.yml', '.github/workflows/native-quality.yml') }}

      - name: Set up the pinned Windows build environment
        shell: pwsh
        run: |
          ./tools/run_windows_workspace.ps1 -Mode Setup

      - name: Run the complete Windows workspace gates
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          ./tools/run_windows_workspace.ps1 -Mode Workspace -RequireCleanTree

      - name: Save Cargo downloads from trusted main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/easycon-windows-workspace/caches/cargo-download-cache
          key: ${{ steps.cargo_cache.outputs.cache-primary-key }}

      - name: Save vcpkg binaries from trusted main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.vcpkg_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/easycon-windows-workspace/caches/vcpkg-binary-cache
          key: ${{ steps.vcpkg_cache.outputs.cache-primary-key }}
