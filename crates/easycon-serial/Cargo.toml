[package]
name = "easycon-serial"
description = "Windows serial discovery and ControllerTransport adapter for EasyCon SDK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
easycon-controller = { path = "../easycon-controller" }
easycon-runtime = { path = "../easycon-runtime" }

[dev-dependencies]
easycon-model = { path = "../easycon-model" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
