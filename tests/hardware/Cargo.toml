[package]
name = "easycon-hardware-qualification"
description = "Non-release Phase 2B CH32 hardware qualification CLI"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-only"
publish = false

[workspace]
members = ["file-id-handle"]
resolver = "3"

[dependencies]
crossterm = "0.29.0"
ctrlc = "3.5.0"
easycon-controller = { path = "../../crates/easycon-controller" }
easycon-model = { path = "../../crates/easycon-model" }
easycon-runtime = { path = "../../crates/easycon-runtime" }
easycon-serial = { path = "../../crates/easycon-serial" }
serde_json = "1.0"
sha2 = "0.10.9"

[build-dependencies]
sha2 = "0.10.9"

[target.'cfg(windows)'.dependencies]
easycon-hardware-file-id = { path = "file-id-handle" }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.dev-dependencies]
junction = { version = "2.0.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
